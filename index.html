<!-- =====================================================
     THEME
===================================================== -->

<script>

const themeButton =
    document.getElementById("theme");


/* تحميل الوضع المحفوظ */

if (
    localStorage.getItem("theme") === "dark"
) {

    document.body.classList.add("dark");

    themeButton.textContent = "☀️";

}


/* تغيير الوضع */

themeButton.addEventListener(
    "click",
    function () {

        document.body.classList.toggle("dark");


        const dark =
            document.body.classList.contains("dark");


        localStorage.setItem(
            "theme",
            dark
                ? "dark"
                : "light"
        );


        themeButton.textContent =
            dark
                ? "☀️"
                : "🌙";

    }
);

</script>



<!-- =====================================================
     HOME PROGRESS
===================================================== -->

<script>

function getKnownWords() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "wortivaKnownWords"
            ) || "[]"
        );

    }

    catch {

        return [];

    }

}



function getWordKey(word) {

    return [

        word.chapter,
        word.category,
        word.order,
        word.german

    ].join("|");

}



function updateHomeProgress() {

    const progressPercent =
        document.getElementById(
            "homeProgressPercent"
        );


    const progressFill =
        document.getElementById(
            "homeProgressFill"
        );


    const knownWordsElement =
        document.getElementById(
            "homeKnownWords"
        );


    const totalWordsElement =
        document.getElementById(
            "homeTotalWords"
        );


    if (
        !progressPercent ||
        !progressFill ||
        !knownWordsElement ||
        !totalWordsElement
    ) {

        return;

    }


    const words =
        Array.isArray(netzwerkA1Words)
            ? netzwerkA1Words.filter(
                word =>
                    word &&
                    word.german
            )
            : [];


    const total =
        words.length;


    const knownWords =
        getKnownWords();


    let known = 0;


    words.forEach(
        function(word) {

            const key =
                getWordKey(word);


            if (
                knownWords.includes(key)
            ) {

                known++;

            }

        }
    );


    const percent =
        total > 0
            ? Math.round(
                (known / total) * 100
            )
            : 0;


    progressPercent.textContent =
        `${percent}%`;


    progressFill.style.width =
        `${percent}%`;


    knownWordsElement.textContent =
        `${known} كلمة متقنة`;


    totalWordsElement.textContent =
        `من ${total} كلمة`;

}



updateHomeProgress();

</script>



<!-- =====================================================
     HEADER USER
===================================================== -->

<script>

async function loadHeaderUser() {

    try {

        const {
            data: {
                session
            }
        } =
            await supabaseClient.auth.getSession();


        const loginButton =
            document.getElementById(
                "loginButton"
            );


        const profileButton =
            document.getElementById(
                "profileButton"
            );


        const username =
            document.getElementById(
                "headerUsername"
            );


        const avatar =
            document.getElementById(
                "headerAvatar"
            );


        const defaultAvatar =
            document.getElementById(
                "headerAvatarDefault"
            );


        /* =========================================
           NOT LOGGED IN
        ========================================= */

        if (!session) {

            if (loginButton) {

                loginButton.style.display =
                    "flex";

            }


            if (profileButton) {

                profileButton.style.display =
                    "none";

            }


            return;

        }


        /* =========================================
           LOGGED IN
        ========================================= */

        const user =
            session.user;


        const metadata =
            user.user_metadata || {};


        const name =
            metadata.username ||
            metadata.name ||
            user.email?.split("@")[0] ||
            "مستخدم Wortiva";


        const avatarUrl =
            metadata.avatar_url ||
            "";


        if (username) {

            username.textContent =
                name;

        }


        if (
            avatarUrl &&
            avatar
        ) {

            avatar.src =
                avatarUrl;


            avatar.style.display =
                "block";


            if (defaultAvatar) {

                defaultAvatar.style.display =
                    "none";

            }

        }

        else {

            if (avatar) {

                avatar.style.display =
                    "none";

            }


            if (defaultAvatar) {

                defaultAvatar.style.display =
                    "inline";

            }

        }


        if (loginButton) {

            loginButton.style.display =
                "none";

        }


        if (profileButton) {

            profileButton.style.display =
                "flex";

        }

    }

    catch (error) {

        console.error(
            "Header profile error:",
            error
        );

    }

}


/* تحميل المستخدم */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadHeaderUser();

    }
);


/* تحديث الهيدر عند تغير حالة تسجيل الدخول */

if (
    typeof supabaseClient !== "undefined"
) {

    supabaseClient.auth.onAuthStateChange(
        function() {

            loadHeaderUser();

        }
    );

}

</script>
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("./sw.js")
                .then(() => {
                    console.log("Wortiva Service Worker registered");
                })
                .catch(error => {
                    console.error("Wortiva Service Worker error:", error);
                });
        });

</script>

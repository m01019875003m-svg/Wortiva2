<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wortiva - Kapitel</title>

    <link rel="stylesheet" href="../css/main.css">
</head>

<body>

<header class="topbar">

    <a href="../index.html" class="logo">
        <span class="logo-icon">W</span>
        <span>Wortiva</span>
    </a>

    <div class="header-actions">

        <button class="icon-button" id="themeButton">
            🌙
        </button>

        <a href="profile.html" class="profile-button">

            <div class="profile-avatar">
                👤
            </div>

            <div class="profile-info">
                <span class="profile-name">
                    Mohammed
                </span>

                <small>
                    حسابي
                </small>
            </div>

        </a>

    </div>

</header>


<main class="chapters-page">

    <section class="page-heading">

        <a href="netzwerk.html" class="back-button">
            → المستويات
        </a>

        <div class="page-icon">
            📚
        </div>

        <h1 id="levelTitle">
            Netzwerk A1
        </h1>

        <p>
            اختر الـ Kapitel الذي تريد تعلمه
        </p>

    </section>


    <section class="chapters-section">

        <div
            id="chaptersGrid"
            class="chapters-grid">
        </div>

    </section>

</main>


<footer>

    <div class="footer-logo">
        Wortiva
    </div>

    <p>
        تعلم الألمانية بطريقة أسهل 🇩🇪
    </p>

    <div class="copyright">
        creating by mohamed Ibrahim khafagy
    </div>

</footer>


<script>

    /* =========================
       THEME
    ========================= */

    const themeButton =
        document.getElementById("themeButton");


    function loadTheme() {

        if (
            localStorage.getItem("theme") === "dark"
        ) {

            document.body.classList.add("dark");

            themeButton.textContent = "☀️";

        }

    }


    themeButton.addEventListener(
        "click",
        function () {

            document.body.classList.toggle("dark");

            const dark =
                document.body.classList.contains("dark");

            localStorage.setItem(
                "theme",
                dark ? "dark" : "light"
            );

            themeButton.textContent =
                dark ? "☀️" : "🌙";

        }
    );


    loadTheme();


    /* =========================
       KAPITEL DATA
    ========================= */

    const chapters = {

        A1: [

            {
                id: 1,
                german: "Guten Tag!",
                arabic: "مرحبًا!"
            },

            {
                id: 2,
                german: "Meine Familie",
                arabic: "عائلتي"
            },

            {
                id: 3,
                german: "Freunde und Freizeit",
                arabic: "الأصدقاء ووقت الفراغ"
            },

            {
                id: 4,
                german: "Guten Appetit!",
                arabic: "شهية طيبة!"
            },

            {
                id: 5,
                german: "Alltag und Termine",
                arabic: "الحياة اليومية والمواعيد"
            },

            {
                id: 6,
                german: "Zeit mit Freunden",
                arabic: "وقت مع الأصدقاء"
            },

            {
                id: 7,
                german: "Arbeitsalltag",
                arabic: "الحياة اليومية في العمل"
            },

            {
                id: 8,
                german: "Fit und gesund",
                arabic: "اللياقة والصحة"
            },

            {
                id: 9,
                german: "Meine Wohnung",
                arabic: "شقتي"
            },

            {
                id: 10,
                german: "Studium und Beruf",
                arabic: "الدراسة والمهنة"
            },

            {
                id: 11,
                german: "Unterwegs",
                arabic: "في الطريق / أثناء التنقل"
            },

            {
                id: 12,
                german: "Freizeit und mehr",
                arabic: "وقت الفراغ والمزيد"
            }

        ],


        A2: [],

        B1: [],

        B2: []

    };


    /* =========================
       GET SELECTED LEVEL
    ========================= */

    const selectedLevel =
        localStorage.getItem(
            "selectedNetzwerkLevel"
        ) || "A1";


    document.getElementById(
        "levelTitle"
    ).textContent =
        "Netzwerk " + selectedLevel;


    /* =========================
       SHOW CHAPTERS
    ========================= */

    const chaptersGrid =
        document.getElementById(
            "chaptersGrid"
        );


    const selectedChapters =
        chapters[selectedLevel];


    if (
        selectedChapters.length === 0
    ) {

        chaptersGrid.innerHTML = `
            <div class="empty-chapters">
                <div>📚</div>

                <h3>
                    سيتم إضافة هذا المستوى قريبًا
                </h3>

                <p>
                    محتوى ${selectedLevel}
                    قيد الإعداد.
                </p>
            </div>
        `;

    } else {

        selectedChapters.forEach(
            function (chapter) {

                const card =
                    document.createElement("button");

                card.className =
                    "chapter-card";

                card.dataset.chapter =
                    chapter.id;


                card.innerHTML = `

                    <div class="chapter-number">
                        ${chapter.id}
                    </div>

                    <div class="chapter-content">

                        <span>
                            Kapitel ${chapter.id}
                        </span>

                        <h2>
                            ${chapter.german}
                        </h2>

                        <p>
                            ${chapter.arabic}
                        </p>

                    </div>

                    <div class="chapter-arrow">
                        ←
                    </div>
                `;


                card.addEventListener(
                    "click",
                    function () {

                        localStorage.setItem(
                            "netzwerkLevel",
                            selectedLevel
                        );

                        localStorage.setItem(
                            "netzwerkKapitel",
                            chapter.id
                        );

                        localStorage.setItem(
                            "netzwerkKapitelTitle",
                            chapter.german
                        );

                        window.location.href =
                            "categories.html";

                    }
                );


                chaptersGrid.appendChild(card);

            }
        );

    }

</script>

</body>
</html>
